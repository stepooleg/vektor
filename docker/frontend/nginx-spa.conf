# =============================================================================
# Vektor — SPA-конфиг для frontend-serve-образа.
# Отдаёт собранную статику React/Vite; для клиентских маршрутов (react-router)
# возвращает index.html, чтобы обновление любой ссылки работало корректно.
# (Reverse-proxy между сервисами — отдельный nginx-сервис в docker-compose.)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Безопасность (SPEC §12.2).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Долгое кеширование хешированных ассетов Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-fallback: неизвестные пути → index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

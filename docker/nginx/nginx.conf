# =============================================================================
# Vektor — Nginx reverse-proxy (dev/прод-совместимая конфигурация).
# - /api/   → backend (Gunicorn :8000)
# - /admin/ → backend
# - /       → frontend (Vite dev :5173 в dev; статики в проде)
# SPEC §11.1: Nginx + Gunicorn; терминация TLS — на边缘е периметра.
# =============================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;          # вложения LMS/портфолио

    # Gzip для текстовых ассетов.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;

    # Базовые заголовки безопасности (SPEC §12.2).
    server {
        listen 80;
        server_name _;

        # Заголовки безопасности.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        # API → backend (Gunicorn).
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django admin → backend.
        location /admin/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Статика Django (collectstatic).
        location /static/ {
            proxy_pass http://backend:8000;
        }

        # Frontend: dev — Vite (5173), прод — собранная статика (этот же Nginx).
        location / {
            # В dev-окружении compose монтирует override, указывающий на frontend:5173.
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

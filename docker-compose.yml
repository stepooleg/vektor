# =============================================================================
# Vektor — Docker Compose (базовая, прод-совместимая конфигурация).
# Dev-настройки — в docker-compose.override.yml (применяется автоматически).
# SPEC §11.1: PostgreSQL 16, Redis 7, Gunicorn, Nginx, Vite. On-premise.
# Все секреты — через .env (см. .env.example), в compose их нет.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vektor}
      POSTGRES_USER: ${POSTGRES_USER:-vektor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vektor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # В проде порт наружу НЕ выставляется; dev-доступ — через override.
    expose: ["5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose: ["6379"]

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vektor}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-vektor}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SETTINGS_MODULE: vektor.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["8000"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: serve
    restart: unless-stopped
    depends_on:
      - backend
    expose: ["80"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
